# VaultDex daily production smoke — deploy drift detector.
#
# Same signed-out Playwright smoke spec as CI, but pointed at production
# (https://vaultdex-three.vercel.app) once a day. Catches drift that the
# PR gate can't: Vercel rewrites/env changes, catalog data regressions from
# the weekly refresh, and upstream asset outages.
#
# Signed-out only; no secrets anywhere in this workflow.
name: Daily production smoke

on:
  schedule:
    # Daily ~7am PT (14:00 UTC).
    - cron: "0 14 * * *"
  workflow_dispatch: {}

jobs:
  smoke-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dev dependencies
        run: npm ci

      - name: Install Playwright Chromium
        # GitHub-hosted runners allow sudo, so --with-deps installs the OS
        # libraries Chromium needs (libnss3, libatk, ...). Plain
        # `npx playwright install chromium` would suffice on a machine that
        # already has them.
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke (production)
        # Signed-out spec only: the signed-in suite injects a fake owner
        # session and is local-server-only by design (see qa/signed-in.spec.js).
        # The upstream-contract spec also runs here (production only): it
        # asserts the PkmnPrices response shape through the deployed proxy at
        # ~2 credits/day, catching upstream drift before the Sunday refresh.
        env:
          BASE_URL: https://vaultdex-three.vercel.app
        run: npx playwright test qa/smoke.spec.js qa/upstream-contract.spec.js qa/a11y.spec.js
